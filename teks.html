<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktif PERMISI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        #instruction {
            color: #fff;
            font-size: 20px;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            text-align: center;
        }

        #target-container {
            display: flex;
            gap: 15px;
            margin-bottom: 50px;
        }

        .zone {
            width: 65px;
            height: 65px;
            border: 2px dashed #fff;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
        }

        .letter {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: #333;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            cursor: move;
            position: absolute;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            transition: transform 0.1s;
            touch-action: none;
            z-index: 10;
        }

        .correct {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%) !important;
            color: #111;
        }
    </style>
</head>
<body>

    <div id="instruction">Susun huruf-huruf di bawah ini menjadi kata <b>"PERMISI"</b></div>

    <div id="target-container">
        <div class="zone" data-letter="P"></div>
        <div class="zone" data-letter="E"></div>
        <div class="zone" data-letter="R"></div>
        <div class="zone" data-letter="M"></div>
        <div class="zone" data-letter="I"></div>
        <div class="zone" data-letter="S"></div>
        <div class="zone" data-letter="I"></div>
    </div>

    <script>
        const targetWord = "PERMISI";
        const zones = document.querySelectorAll('.zone');
        const lettersArray = targetWord.split('');
        
        // Memastikan posisi huruf berada di area tengah bawah layar agar terlihat
        lettersArray.forEach((char, index) => {
            const letterEl = document.createElement('div');
            letterEl.classList.add('letter');
            letterEl.innerText = char;
            letterEl.id = `letter-${index}`;
            document.body.appendChild(letterEl);

            const randomX = Math.random() * (window.innerWidth - 100) + 50;
            const randomY = Math.random() * 100 + (window.innerHeight * 0.65);
            letterEl.style.left = `${randomX}px`;
            letterEl.style.top = `${randomY}px`;

            initDrag(letterEl);
        });

        function initDrag(el) {
            let currentX, currentY, initialX, initialY;
            let xOffset = 0, yOffset = 0;

            el.addEventListener('touchstart', dragStart, {passive: false});
            el.addEventListener('touchend', dragEnd, {passive: false});
            el.addEventListener('touchmove', drag, {passive: false});

            el.addEventListener('mousedown', dragStart, false);
            el.addEventListener('mouseup', dragEnd, false);
            el.addEventListener('mousemove', drag, false);

            function dragStart(e) {
                if (e.type === "touchstart") {
                    initialX = e.touches[0].clientX - xOffset;
                    initialY = e.touches[0].clientY - yOffset;
                } else {
                    initialX = e.clientX - xOffset;
                    initialY = e.clientY - yOffset;
                }
                if (e.target === el) {
                    el.style.zIndex = 1000;
                }
            }

            function drag(e) {
                if (initialX !== undefined) {
                    e.preventDefault();
                    if (e.type === "touchmove") {
                        currentX = e.touches[0].clientX - initialX;
                        currentY = e.touches[0].clientY - initialY;
                    } else {
                        currentX = e.clientX - initialX;
                        currentY = e.clientY - initialY;
                    }
                    xOffset = currentX;
                    yOffset = currentY;
                    el.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
                }
            }

            function dragEnd() {
                initialX = undefined;
                initialY = undefined;
                el.style.zIndex = '10';
                checkDrop(el);
            }
        }

        function checkDrop(el) {
            const elRect = el.getBoundingClientRect();
            const elCenterX = elRect.left + elRect.width / 2;
            const elCenterY = elRect.top + elRect.height / 2;

            zones.forEach(zone => {
                const zoneRect = zone.getBoundingClientRect();
                
                if (
                    elCenterX > zoneRect.left && elCenterX < zoneRect.right &&
                    elCenterY > zoneRect.top && elCenterY < zoneRect.bottom
                ) {
                    if (zone.getAttribute('data-letter') === el.innerText && !zone.classList.contains('filled')) {
                        el.style.transform = 'none';
                        el.style.left = `${zoneRect.left + (zoneRect.width - elRect.width)/2}px`;
                        el.style.top = `${zoneRect.top + (zoneRect.height - elRect.height)/2}px`;
                        el.classList.add('correct');
                        zone.classList.add('filled');
                        el.style.pointerEvents = 'none';
                        checkWin();
                    }
                }
            });
        }

        function checkWin() {
            const filledZones = document.querySelectorAll('.zone.filled');
            if (filledZones.length === zones.length) {
                document.getElementById('instruction').innerHTML = "<b style='color:#84fab0;'>BERHASIL! Mengalihkan...</b>";
                setTimeout(() => {
                    window.top.location.href = "https://opangdarmawanproject.github.io/OpangDarmawanPage/";
                }, 1000);
            }
        }
    </script>
</body>
</html>
